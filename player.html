<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>따라 읽기</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <header class="top">
    <a href="index.html">← 주제 목록</a>
    <h1 id="title">따라 읽기</h1>
    <p id="titlePy" class="py"></p>
    <p id="titleKo" class="ko"></p>
  </header>
  <section class="controls" id="controls">
    <div class="actions playbar">
      <button id="play" type="button">재생</button>
      <button id="pause" type="button" class="secondary" disabled>일시정지</button>
      <button id="stop" type="button" class="secondary">정지</button>
    </div>
    <div class="settings-bar">
      <button id="settingsToggle" type="button" class="secondary" aria-expanded="true" aria-controls="settingsPanel">⚙ 설정</button>
      <p id="settingsSummary"></p>
    </div>
    <div id="settingsPanel">
    <div class="lang-switch" role="group" aria-label="language">
      <button id="langEn" type="button" aria-pressed="true">English</button>
      <button id="langZh" type="button" aria-pressed="false">中文</button>
    </div>
    <div class="row">
      <label class="field">단어 따라읽기 횟수
        <select id="wordN">
          <option value="0">0 (건너뛰기)</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="field">본문 문장별 따라읽기 횟수
        <select id="sentN">
          <option value="0">0 (건너뛰기)</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="field">본문 전체 듣기 횟수
        <select id="fullN">
          <option value="0">0 (건너뛰기)</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="field">단어 읽기 속도
        <select id="wordRate">
          <option value="0.6">0.6x</option>
          <option value="0.7">0.7x</option>
          <option value="0.8">0.8x</option>
          <option value="0.9">0.9x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.1">1.1x</option>
          <option value="1.2">1.2x</option>
          <option value="1.3">1.3x</option>
        </select>
      </label>
      <label class="field">문장 읽기 속도
        <select id="sentRate">
          <option value="0.6">0.6x</option>
          <option value="0.7">0.7x</option>
          <option value="0.8">0.8x</option>
          <option value="0.9">0.9x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.1">1.1x</option>
          <option value="1.2">1.2x</option>
          <option value="1.3">1.3x</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <button id="koToggle" type="button" class="secondary">한국어 뜻 숨기기</button>
      <button id="pyToggle" type="button" class="secondary" hidden>拼音 숨기기</button>
      <a id="prev" class="nav" href="#" hidden>이전</a>
      <a id="next" class="nav" href="#" hidden>다음</a>
    </div>
    </div>
    <div id="status">횟수를 고르고 재생을 누르세요. 0은 그 부분을 건너뜁니다.</div>
  </section>
  <div class="layout">
    <ol id="passage" class="passage"></ol>
    <aside>
      <h2 id="wordsHeading">Words 단어</h2>
      <div id="words"></div>
    </aside>
  </div>
  <script src="player.js"></script>
</body>
</html>
